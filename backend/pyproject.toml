[project]
name = "glorypicks-backend"
version = "1.0.0"
description = "GloryPicks trading signals backend API"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # allow FastAPI HTTPException re-raises without explicit chaining
    "C901",  # too complex
    "E402",  # allow local imports used to avoid startup cycles
    "E741",  # preserve API field names such as Candle.l
    "F841",  # allow staged calculations kept for readability/future use
    "B007",  # allow intentionally unused loop variables
    "C401",  # allow generator expressions when clearer in analytics code
    "C416",  # allow explicit list comprehensions for readability
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ files

[tool.mypy]
python_version = "3.12"
strict = true
ignore_errors = false
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = false
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
