[project]
name = "glorypicks-backend"
version = "1.0.0"
description = "GloryPicks trading signals backend API"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # allow FastAPI HTTPException re-raises without explicit chaining
    "C901",  # too complex
    "E402",  # allow local imports used to avoid startup cycles
    "E741",  # preserve API field names such as Candle.l
    "F841",  # allow staged calculations kept for readability/future use
    "B007",  # allow intentionally unused loop variables
    "C401",  # allow generator expressions when clearer in analytics code
    "C416",  # allow explicit list comprehensions for readability
    "UP006", # allow typing.List/Dict aliases during gradual modernization
    "UP007", # allow Optional/Union aliases during gradual modernization
    "UP035", # allow legacy typing imports during gradual modernization
    "UP041", # allow aliased timeout errors for library compatibility
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ files

[tool.mypy]
python_version = "3.12"
strict = false
ignore_errors = true
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
